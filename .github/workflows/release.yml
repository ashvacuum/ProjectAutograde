name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # electron-builder names its output from package.json "version", NOT the
      # git tag. Without this step, pushing a tag whose commit didn't bump
      # package.json ships a stale binary (e.g. a v1.2.0 tag producing 1.0.5
      # assets). Derive the version from the tag so the build always matches.
      - name: Sync version to tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Building version $VERSION (from tag $GITHUB_REF_NAME)"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm install

      - name: Build Windows
        run: npm run build-win

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            dist/*.exe
            dist/*.zip

  create-release:
    needs: release
    runs-on: ubuntu-latest
    # Only publish a GitHub Release for tag pushes — a manual workflow_dispatch
    # on a branch has no tag and would fail (and historically did).
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          # Auto-generate notes from commits/PRs since the last tag. The old
          # body_path: CHANGELOG.md pinned every release to the static
          # "[Unreleased]" block, so the notes never reflected the new version.
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
